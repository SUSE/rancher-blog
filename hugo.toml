baseURL = "https://www.rancher.com/"
title = "Rancher Blog"
locale = "en-US"
enableRobotsTXT = true
# root sitemap.xml is outside /blog/, so CloudFront never serves it: layouts/index.blogsitemap.xml writes /blog/sitemap.xml instead
disableKinds = ["sitemap"]
# relative links so the same build works on rancher.com/blog and on the Pages origin (opensource.suse.com/rancher-blog)
relativeURLs = true
capitalizeListTitles = false
removePathAccents = true

[params]
  description = "Hands-on posts from the Rancher community: Kubernetes, K3s, RKE2, Longhorn, Fleet, Harvester, NeuVector and more."
  # rancher.com tracking, same IDs as the rest of the site (layouts/partials/tracking.html)
  gtmID = "GTM-57KS2MW"
  oneTrustID = "0f98beb0-fc4c-417d-a42e-564e2cae42d2"
  enterpriseURL = "https://www.suse.com/products/rancher/"
  # filter pills on the blog home: current projects only
  featuredProducts = ["Rancher Manager", "K3s", "RKE2", "Longhorn", "Fleet", "Harvester", "NeuVector", "Rancher Desktop", "Kubewarden", "Elemental"]

[outputFormats.blogsitemap]
  mediaType = "application/xml"
  baseName = "sitemap"
  path = "blog"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "blogsitemap"]

[pagination]
  pagerSize = 12

# CloudFront only routes /blog/* to this site, so every page lives under /blog/
[permalinks]
  [permalinks.page]
    blog = "/blog/:slug/"
  [permalinks.section]
    blog = "/blog/"
  [permalinks.taxonomy]
    products = "/blog/products/"
    tags = "/blog/tags/"
    authors = "/blog/authors/"
  [permalinks.term]
    products = "/blog/products/:slug/"
    tags = "/blog/tags/:slug/"
    authors = "/blog/authors/:slug/"

[taxonomies]
  tag = "tags"
  author = "authors"
  product = "products"

[markup.goldmark.renderer]
  # migrated WordPress posts keep a few raw HTML embeds (iframes, figures)
  unsafe = true

[markup.highlight]
  noClasses = false
